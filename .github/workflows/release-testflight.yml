# 2단계: 서명된 출시 빌드를 만들어 App Store Connect(TestFlight)에 올립니다.
# Actions 탭에서 수동 실행(Run workflow)할 때만 동작합니다.
#
# 필요한 저장소 Secrets (docs/RELEASE_FROM_LINUX.md 참고):
#   TEAM_ID              Apple 팀 ID (10자리)
#   PROFILE_NAME         App Store 프로비저닝 프로파일 이름
#   PROFILE_BASE64       .mobileprovision 파일의 base64
#   DIST_P12_BASE64      배포 인증서 .p12의 base64
#   DIST_P12_PASSWORD    .p12 비밀번호
#   ASC_KEY_ID           App Store Connect API 키 ID
#   ASC_ISSUER_ID        App Store Connect API 발급자 ID
#   ASC_KEY_P8_BASE64    API 키 .p8 파일의 base64
name: Release to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_offset:
        description: "빌드 번호 = 실행 번호 + 이 값 (빌드 번호는 올릴 때마다 커져야 함)"
        default: "0"
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
      PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
      KEYCHAIN: build.keychain-db
    steps:
      - uses: actions/checkout@v7

      - name: 비밀값 확인
        run: |
          missing=""
          for v in TEAM_ID PROFILE_NAME; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          [ -z "${{ secrets.PROFILE_BASE64 }}" ] && missing="$missing PROFILE_BASE64"
          [ -z "${{ secrets.DIST_P12_BASE64 }}" ] && missing="$missing DIST_P12_BASE64"
          [ -z "${{ secrets.ASC_KEY_P8_BASE64 }}" ] && missing="$missing ASC_KEY_P8_BASE64"
          if [ -n "$missing" ]; then echo "::error::Secrets 누락:$missing"; exit 1; fi
          xcodebuild -version

      - name: 서명 인증서·프로파일 설치 (임시 키체인)
        env:
          P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          KC_PASS=$(openssl rand -hex 16)
          echo "KC_PASS=$KC_PASS" >> "$GITHUB_ENV"
          echo "::add-mask::$KC_PASS"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -)
          # Xcode 버전에 따라 찾는 위치가 달라 두 곳 모두에 둡니다.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/app.mobileprovision" "$dir/$uuid.mobileprovision"
          done
          echo "프로파일 UUID: $uuid"

      - name: Xcode 프로젝트 생성
        run: |
          brew install xcodegen
          xcodegen

      - name: 아카이브
        run: |
          set -o pipefail
          BUILD_NUMBER=$(( ${{ github.run_number }} + ${{ github.event.inputs.build_offset || 0 }} ))
          echo "빌드 번호: $BUILD_NUMBER"
          xcodebuild archive \
            -project ObjectKey.xcodeproj \
            -scheme ObjectKey \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ObjectKey.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: 내보내기 + App Store Connect 업로드
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -o pipefail
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleIdentifier" \
            "$RUNNER_TEMP/ObjectKey.xcarchive/Info.plist")
          echo "번들 ID: $BUNDLE_ID"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ObjectKey.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export.log
          echo "업로드 완료. App Store Connect에서 처리(10~30분) 후 TestFlight에 나타납니다."

      - name: 실패 시 로그 보관
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-logs
          path: |
            archive.log
            export.log

      - name: 비밀 파일·키체인 정리
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/app.mobileprovision"
