# 1단계: 서명 없이 빌드·테스트만 확인합니다. Apple 계정이나 비밀값이 필요 없습니다.
# 푸시할 때마다 클라우드 맥에서 컴파일 오류와 테스트 실패를 알려줍니다.
name: Build check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: ""
      PROFILE_NAME: ""
      WIDGET_PROFILE_NAME: ""
      WATCH_PROFILE_NAME: ""
      WATCH_WIDGET_PROFILE_NAME: ""
    steps:
      - uses: actions/checkout@v7

      - name: Xcode 버전 확인 (26 이상 필요)
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode 26 이상이 필요합니다 (현재 $major)"; exit 1
          fi

      - name: 판단 로직 단위 테스트
        working-directory: ObjectKeyCore
        run: swift test

      - name: Xcode 프로젝트 생성
        run: |
          brew install xcodegen
          xcodegen

      - name: 앱 빌드 (시뮬레이터, 서명 없음)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ObjectKey.xcodeproj \
            -scheme ObjectKey \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: 워치 앱·위젯이 앱 안에 들어갔는지 확인
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "MOKI.app" -path "*iphonesimulator*" | head -1)
          echo "앱: $app"
          ls "$app" | head -50
          ls "$app/PlugIns" 2>/dev/null || echo "(PlugIns 없음)"
          ls "$app/Watch" 2>/dev/null || echo "(Watch 없음)"
          test -d "$app/PlugIns/MOKIWidgets.appex" || { echo "::error::위젯 확장이 앱 안에 없습니다"; exit 1; }
          test -d "$app/Watch/MOKIWatch.app" || { echo "::error::워치 앱이 앱 안에 없습니다"; exit 1; }
          ls "$app/Watch/MOKIWatch.app/PlugIns" 2>/dev/null || echo "(워치 PlugIns 없음)"
          test -d "$app/Watch/MOKIWatch.app/PlugIns/MOKIWatchWidgets.appex" || { echo "::error::워치 컴플리케이션이 워치 앱 안에 없습니다"; exit 1; }

      - name: 앱 저장소 통합 테스트 (시뮬레이터)
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ios=sorted((k,v) for k,v in d.items() if 'iOS' in k)
          print([x for x in ios[-1][1] if x['name'].startswith('iPhone')][-1]['udid'])")
          set -o pipefail
          xcodebuild test \
            -project ObjectKey.xcodeproj \
            -scheme ObjectKey \
            -destination "id=$udid" \
            -only-testing:ObjectKeyTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep --line-buffered -E "error:|Test Case|plus |TEST (SUCCEEDED|FAILED)|exceeded" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: 실패 시 빌드 로그 보관
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: |
            build.log
            test.log
