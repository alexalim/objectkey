# XcodeGen 설정. `brew install xcodegen && xcodegen` 으로 ObjectKey.xcodeproj를 만듭니다.
# 맥 없이 GitHub Actions(macos-26)에서 빌드합니다 — docs/RELEASE_FROM_LINUX.md 참고.
name: ObjectKey   # 내부 코드명. 사용자에게 보이는 앱 이름은 MOKI(모키)
options:
  bundleIdPrefix: com.aspynlim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 6 컴파일러에서도 Swift 5 언어 모드로 빌드
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 팀 ID는 CI에서 환경 변수(TEAM_ID)로 넣습니다.
    DEVELOPMENT_TEAM: "${TEAM_ID}"

packages:
  ObjectKeyCore:
    path: ObjectKeyCore

targets:
  ObjectKey:
    type: application
    platform: iOS
    sources:
      - path: ObjectKey
      - path: Shared
    dependencies:
      - package: ObjectKeyCore
      - target: ObjectKeyWidgets
      - target: MOKIWatch
    entitlements:
      path: ObjectKey/ObjectKey.entitlements
      properties:
        com.apple.security.application-groups: [group.com.aspynlim.moki]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: ObjectKey/Info.plist
      properties:
        NSSupportsLiveActivities: true
        CFBundleDisplayName: MOKI
        # Siri는 한국어로 "모키"라고 받아 적어 영문 MOKI와 맞지 않는다. 읽는 이름과 다른 이름을 알려 준다.
        CFBundleSpokenName: 모키
        INAlternativeAppNames:
          - INAlternativeAppName: 모키
            INAlternativeAppNamePronunciationHint: 모키
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # 쓰지는 않지만 HealthKit 권한이 있으면 Apple이 쓰기 설명도 요구한다(없으면 업로드 거절).
        NSHealthUpdateUsageDescription: "MOKI는 건강 앱에 데이터를 쓰지 않습니다. 걸음 수·운동 시간·마음챙김 기록을 읽기만 합니다."
        NSHealthShareUsageDescription: "건강 앱의 걸음 수·운동 시간·마음챙김 기록을 읽어, 목표를 넘은 날 습관을 자동으로 채웁니다. 읽기만 하고 어디에도 보내지 않습니다."
        NSCameraUsageDescription: "등록한 물건을 알아보려고 카메라를 씁니다. 찍은 사진은 어디에도 보내지 않습니다."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aspynlim.moki
        PRODUCT_NAME: MOKI
        # 기기 안 AI(FoundationModels)는 iOS 26부터 있다. 약하게 연결해야 iOS 17~25에서 실행하자마자 죽지 않는다.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"   # iPhone 전용
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
      configs:
        # 출시 빌드는 수동 서명. 서명 설정을 앱 타깃에만 두어야 SPM 패키지 타깃 빌드가 깨지지 않습니다.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "${PROFILE_NAME}"

  # 잠금 화면 실시간 현황(Live Activity)과 홈·잠금 화면 위젯.
  ObjectKeyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ObjectKeyWidgets
      - path: Shared
    entitlements:
      path: ObjectKeyWidgets/ObjectKeyWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.aspynlim.moki]
    info:
      path: ObjectKeyWidgets/Info.plist
      properties:
        CFBundleDisplayName: MOKI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aspynlim.moki.widgets
        PRODUCT_NAME: MOKIWidgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "${WIDGET_PROFILE_NAME}"

  # Apple Watch 앱. 아이폰과 WatchConnectivity로 오늘 요약·기록을 주고받는다(워치는 App Group을 못 읽는다).
  MOKIWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: MOKIWatch
      - path: Shared/WidgetSnapshot.swift
    dependencies:
      - target: MOKIWatchWidgets
    entitlements:
      path: MOKIWatch/MOKIWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.aspynlim.moki]
    info:
      path: MOKIWatch/Info.plist
      properties:
        CFBundleDisplayName: MOKI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.aspynlim.moki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aspynlim.moki.watchkitapp
        PRODUCT_NAME: MOKIWatch
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "${WATCH_PROFILE_NAME}"

  # 시계 화면 컴플리케이션. 워치 앱이 워치 안 공유 공간에 쓴 오늘 요약을 읽는다.
  MOKIWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: MOKIWatchWidgets
      - path: Shared/WidgetSnapshot.swift
    entitlements:
      path: MOKIWatchWidgets/MOKIWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.aspynlim.moki]
    info:
      path: MOKIWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: MOKI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aspynlim.moki.watchkitapp.widgets
        PRODUCT_NAME: MOKIWatchWidgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "${WATCH_WIDGET_PROFILE_NAME}"

  # 화면 점검용 UI 테스트. 데모 데이터로 앱을 띄워 주요 화면 스크린샷을 남긴다 (.github/workflows/ui-screens.yml).
  ObjectKeyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ObjectKeyTests
    dependencies:
      - target: ObjectKey
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aspynlim.moki.tests
        # 앱 제품 이름이 MOKI라 기본값(타깃 이름 ObjectKey.app)으로는 테스트 호스트를 못 찾는다.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MOKI.app/MOKI
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1"

  ObjectKeyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ObjectKeyUITests
    dependencies:
      - target: ObjectKey
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aspynlim.moki.uitests
        TEST_TARGET_NAME: ObjectKey
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  ObjectKey:
    build:
      targets:
        ObjectKey: all
    test:
      config: Debug
      targets:
        - ObjectKeyTests
        - ObjectKeyUITests
    run:
      config: Debug
    archive:
      config: Release
